<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a26"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- earlier episodes, fading into the past -->
  <g filter="url(#shadow)">
    <g opacity=".35">
      <rect x="250" y="130" width="250" height="140" rx="14" fill="#2a3442"/>
      <rect x="250" y="290" width="200" height="14" rx="7" fill="#f2f4f7"/>
      <rect x="250" y="316" width="160" height="14" rx="7" fill="#f2f4f7"/>
    </g>
    <g opacity=".6">
      <rect x="520" y="130" width="250" height="140" rx="14" fill="#2f3b4b"/>
      <rect x="520" y="290" width="220" height="14" rx="7" fill="#f2f4f7"/>
      <rect x="520" y="316" width="170" height="14" rx="7" fill="#f2f4f7"/>
    </g>
    <g>
      <rect x="790" y="130" width="250" height="140" rx="14" fill="#34445a" stroke="url(#blue)" stroke-width="4"/>
      <rect x="790" y="290" width="230" height="14" rx="7" fill="#f2f4f7"/>
      <rect x="790" y="316" width="180" height="14" rx="7" fill="#f2f4f7"/>
    </g>
  </g>
  <!-- rewind badge on the latest episode -->
  <g transform="translate(915 200)">
    <circle r="44" fill="url(#blue)"/>
    <path d="M6 -22 L-20 0 L6 22 Z M30 -22 L4 0 L30 22 Z" fill="#0d1117" transform="translate(-6 0)"/>
  </g>

  <text x="640" y="560" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" font-size="112" fill="#f2f4f7" letter-spacing="1">Previously <tspan fill="#33b5f0">On</tspan></text>
</svg>
